<!DOCTYPE html>
<html class="scroll-smooth" lang="id">

<head>

    <meta charset="utf-8">

    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Giza Aura - Digital Scrapbook Portfolio</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">

    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#debec9",
                        "on-secondary-fixed-variant": "#574049",
                        "surface-container-low": "#fff0f4",
                        "primary-fixed-dim": "#f1b7cb",
                        "secondary-container": "#f8d7e2",
                        "surface-container-highest": "#f8dbe5",
                        "surface-container": "#ffe8ef",
                        "on-tertiary-container": "#6e3f52",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#28161e",
                        "inverse-primary": "#f1b7cb",
                        "surface-dim": "#efd3dd",
                        "secondary": "#715861",
                        "tertiary-container": "#ebaec5",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#66394c",
                        "on-primary-container": "#6b4051",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#3d2b33",
                        "on-background": "#27171e",
                        "tertiary-fixed": "#ffd9e5",
                        "surface": "#fff8f8",
                        "background": "#fff8f8",
                        "on-tertiary-fixed": "#330e20",
                        "on-surface-variant": "#504447",
                        "tertiary-fixed-dim": "#f4b5cc",
                        "on-surface": "#27171e",
                        "primary": "#7f5162",
                        "on-error": "#ffffff",
                        "surface-variant": "#f8dbe5",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#815064",
                        "on-secondary-container": "#755c65",
                        "surface-container-high": "#fde1eb",
                        "on-primary-fixed-variant": "#643a4b",
                        "surface-tint": "#7f5162",
                        "on-primary-fixed": "#320f1f",
                        "outline": "#827377",
                        "outline-variant": "#d4c2c6",
                        "inverse-on-surface": "#ffecf2",
                        "secondary-fixed": "#fbdae5",
                        "surface-bright": "#fff8f8",
                        "on-error-container": "#93000a",
                        "primary-container": "#e8afc3",
                        "primary-fixed": "#ffd9e4"
                    },

                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },

                    spacing: {
                        gutter: "24px",
                        "stack-sm": "16px",
                        unit: "8px",
                        "container-max": "1200px",
                        "margin-desktop": "64px",
                        "stack-lg": "64px",
                        "margin-mobile": "20px",
                        "stack-md": "32px"
                    },

                    fontFamily: {
                        caption: ["Montserrat"],
                        "headline-md": ["Playfair Display"],
                        "body-md": ["Montserrat"],
                        "display-lg-mobile": ["Playfair Display"],
                        "body-lg": ["Montserrat"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Montserrat"],
                        "headline-lg": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"]
                    }
                }
            }
        }
    </script>

    <style>

        /* ================================
           SCRAPBOOK SHADOW
        ================================= */

        .scrapbook-shadow {
            box-shadow: 12px 12px 40px -10px rgba(129, 80, 100, 0.15);
        }


        /* ================================
           DOT PATTERN
        ================================= */

        .dotted-pattern {
            background-image: radial-gradient(
                circle at center,
                #ebaec5 2px,
                transparent 2.5px
            );

            background-size: 16px 16px;
        }


        /* ================================
           FADE IN SLOW MOTION
        ================================= */

        .fade-in-section {

            opacity: 0;

            transform: translateY(50px);

            filter: blur(4px);

            transition:
                opacity 2s ease-out,
                transform 2s ease-out,
                filter 2s ease-out;
        }


        .fade-in-section.is-visible {

            opacity: 1;

            transform: translateY(0);

            filter: blur(0);
        }


        /* ================================
           IMAGE FADE
        ================================= */

        .fade-image {

            opacity: 0;

            transform: scale(0.95);

            transition:
                opacity 2.2s ease-out,
                transform 2.2s ease-out;
        }


        .fade-image.is-visible {

            opacity: 1;

            transform: scale(1);
        }


        /* ================================
           HIDE SCROLLBAR
        ================================= */

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    </style>

</head>
